<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desktop Ash</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        position: relative;
      }

      body {
        /* IMPORTANT: do NOT make the body itself a drag region. Transparent bubble
           area passes clicks through to the desktop. Drag is scoped to #pet only. */
      }

      /* Sprite element — always present, sized by CSS var injected from renderer.
         background-size is set dynamically by the renderer once it knows the
         spritesheet's row count (standard 9, v2 25, v3 26 — all 8 cols). */
      #pet {
        position: absolute;
        background-repeat: no-repeat;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        -webkit-app-region: drag;
      }

      /* Bubble container — absolute, hidden when no-bubble, shown when side is set */
      #bubble-stack {
        position: absolute;
        display: flex;
        overflow: hidden;
        pointer-events: none; /* container = pass-through; individual bubbles re-enable */
      }

      /* ── Layout: no-bubble (sprite-only, window = sprite dims) ── */
      body.no-bubble #pet {
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      body.no-bubble #bubble-stack {
        display: none;
      }

      /* ── Layout: side-above (bubble above, sprite below) ── */
      body.side-above #bubble-stack {
        top: 0;
        left: 0;
        width: 100%;
        height: 280px;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding: 8px 4px;
        gap: 6px;
        display: flex;
      }

      body.side-above #pet {
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        /* width/height set via inline style from renderer */
      }

      /* ── Layout: side-below (sprite above, bubble below) ── */
      body.side-below #bubble-stack {
        bottom: 0;
        left: 0;
        width: 100%;
        height: 280px;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 8px 4px;
        gap: 6px;
        display: flex;
      }

      body.side-below #pet {
        top: 0;
        left: 50%;
        transform: translateX(-50%);
      }

      /* ── Layout: side-left (bubble left, sprite right) ── */
      body.side-left #bubble-stack {
        top: 0;
        left: 0;
        width: 240px;
        height: 100%;
        flex-direction: column;
        align-items: flex-end;
        justify-content: center;
        padding: 4px 8px;
        gap: 6px;
        display: flex;
      }

      body.side-left #pet {
        top: 50%;
        right: 0;
        transform: translateY(-50%);
      }

      /* ── Layout: side-right (sprite left, bubble right) ── */
      body.side-right #bubble-stack {
        top: 0;
        right: 0;
        width: 240px;
        height: 100%;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        padding: 4px 8px;
        gap: 6px;
        display: flex;
      }

      body.side-right #pet {
        top: 50%;
        left: 0;
        transform: translateY(-50%);
      }

      /* ── Bubble styles ── */
      .bubble {
        position: relative;
        min-width: 180px;
        max-width: 220px;
        padding: 10px 14px;
        border-radius: 12px;
        border: 2px solid;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        cursor: pointer;
        pointer-events: auto;
        -webkit-app-region: no-drag;
        transition: filter 120ms ease;
        animation: bubbleEnter 250ms ease-out;
      }

      .bubble:hover {
        filter: brightness(1.08);
      }

      .bubble.fading {
        animation: bubbleExit 400ms ease-in forwards;
        pointer-events: none;
      }

      .bubble .agent-label {
        font-size: 10px;
        font-weight: 600;
        opacity: 0.85;
        margin-bottom: 4px;
        text-transform: lowercase;
        letter-spacing: 0.02em;
      }

      .bubble .message {
        font-size: 13px;
        font-weight: 500;
        line-height: 1.35;
        word-wrap: break-word;
      }

      /* ── Tail direction per layout side ── */

      .bubble .tail {
        position: absolute;
        width: 0;
        height: 0;
      }

      /* above (default): tail at bottom-center, points down toward sprite */
      body.side-above .bubble .tail,
      body.no-bubble .bubble .tail {
        bottom: -8px;
        left: 50%;
        transform: translateX(-50%);
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        /* border-top color set inline to match bubble bg */
      }

      /* below: tail at top-center, points up toward sprite */
      body.side-below .bubble .tail {
        top: -8px;
        left: 50%;
        transform: translateX(-50%);
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        /* border-bottom color set inline to match bubble bg */
      }

      /* left: tail at right-center, points right toward sprite */
      body.side-left .bubble .tail {
        top: 50%;
        right: -8px;
        transform: translateY(-50%);
        border-top: 8px solid transparent;
        border-bottom: 8px solid transparent;
        /* border-left color set inline to match bubble bg */
      }

      /* right: tail at left-center, points left toward sprite */
      body.side-right .bubble .tail {
        top: 50%;
        left: -8px;
        transform: translateY(-50%);
        border-top: 8px solid transparent;
        border-bottom: 8px solid transparent;
        /* border-right color set inline to match bubble bg */
      }

      @keyframes bubbleEnter {
        from { transform: translateY(-8px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }

      @keyframes bubbleExit {
        to { opacity: 0; transform: translateY(-4px); }
      }
    </style>
  </head>
  <body class="no-bubble">
    <div id="bubble-stack"></div>
    <div id="pet"></div>
    <script type="module" src="./renderer.ts"></script>
  </body>
</html>
