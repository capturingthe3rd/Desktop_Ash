<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desktop Ash</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        /* IMPORTANT: do NOT make the body itself a drag region. The bubble-stack
           area (top 280px) is transparent when empty; a body-level drag region
           would let macOS treat right-clicks on that empty area as title-bar
           gestures, which crashes the transparent always-on-top window with
           SIGSEGV in Electron 42. Drag is scoped to the visible sprite area. */
      }

      /* Top reserved 280px holds stacked bubbles. Transparent + click-pass-through
         when empty so users can click through to the desktop. */
      #bubble-stack {
        height: 280px;
        flex: 0 0 280px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding: 8px 4px;
        gap: 6px;
        overflow: hidden;
        pointer-events: none; /* container = pass-through; individual bubbles re-enable */
      }

      /* Bottom area = sprite. Takes remaining height. */
      #pet-area {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-app-region: drag;
      }

      #pet {
        /* Height-locked + aspect-ratio gives the correct sprite shape (192:208).
           Width is derived; pet-area centers it horizontally. Without this, the
           sprite would overflow downward when window width > sprite width
           (which happens when the window is widened to fit bubble min-width). */
        height: 100%;
        aspect-ratio: 192 / 208;
        background-repeat: no-repeat;
        background-size: 800% 900%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      .bubble {
        position: relative;
        /* Wider bubble = fewer lines for the same message; reads more like a quick
           thought than a stacked column. min-width keeps short messages from looking
           like tags; max-width caps overly-long single-line bubbles. */
        min-width: 180px;
        max-width: 340px;
        padding: 10px 14px;
        border-radius: 12px;
        border: 2px solid;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        cursor: pointer;
        pointer-events: auto;
        -webkit-app-region: no-drag;
        transition: filter 120ms ease;
        animation: bubbleEnter 250ms ease-out;
      }

      .bubble:hover {
        filter: brightness(1.08);
      }

      .bubble.fading {
        animation: bubbleExit 400ms ease-in forwards;
        pointer-events: none;
      }

      .bubble .agent-label {
        font-size: 10px;
        font-weight: 600;
        opacity: 0.85;
        margin-bottom: 4px;
        text-transform: lowercase;
        letter-spacing: 0.02em;
      }

      .bubble .message {
        font-size: 13px;
        font-weight: 500;
        line-height: 1.35;
        word-wrap: break-word;
      }

      .bubble .tail {
        position: absolute;
        bottom: -8px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        /* border-top color set inline to match bubble bg */
      }

      @keyframes bubbleEnter {
        from { transform: translateY(-8px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }

      @keyframes bubbleExit {
        to { opacity: 0; transform: translateY(-4px); }
      }
    </style>
  </head>
  <body>
    <div id="bubble-stack"></div>
    <div id="pet-area">
      <div id="pet"></div>
    </div>
    <script type="module" src="./renderer.ts"></script>
  </body>
</html>
