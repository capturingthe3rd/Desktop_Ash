<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desktop Ash — Choose Your Pet</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #1a1a1a;
        color: #e0e0e0;
        padding: 24px;
        min-height: 100vh;
        /* Picker window is draggable from the titlebar area at top */
        -webkit-app-region: drag;
      }

      h1 {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 4px;
        color: #ffffff;
      }

      .subtitle {
        font-size: 13px;
        color: #888;
        margin-bottom: 20px;
      }

      #pet-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        /* Cards need no-drag so clicks register */
        -webkit-app-region: no-drag;
      }

      .pet-card {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px 16px;
        background: #2a2a2a;
        border: 2px solid transparent;
        border-radius: 10px;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
      }

      .pet-card:hover {
        background: #333;
        border-color: #555;
      }

      .pet-card.selected {
        border-color: #7c6fff;
        background: #2e2a40;
      }

      .pet-thumb {
        width: 48px;
        height: 52px;
        background-repeat: no-repeat;
        /* Show frame 0 of idle (row 0, col 0) */
        background-size: 800% 900%;
        background-position: 0% 0%;
        image-rendering: pixelated;
        flex-shrink: 0;
        border-radius: 4px;
        background-color: #111;
      }

      .pet-info strong {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        margin-bottom: 4px;
      }

      .pet-info p {
        font-size: 12px;
        color: #999;
        line-height: 1.4;
      }

      #status {
        margin-top: 16px;
        font-size: 12px;
        color: #7c6fff;
        min-height: 18px;
        -webkit-app-region: no-drag;
      }
    </style>
  </head>
  <body>
    <h1>Choose Your Pet</h1>
    <p class="subtitle">Select the pet that will follow you around the screen.</p>
    <div id="pet-list"></div>
    <p id="status"></p>
    <script type="module" src="./picker.ts"></script>
  </body>
</html>
