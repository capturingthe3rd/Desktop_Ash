appId: com.capturingthe3rd.desktop-ash
productName: Desktop Ash
copyright: Copyright © 2026 Armando Gonzales III

directories:
  output: release

mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize:
    teamId: ${env.APPLE_TEAM_ID}

publish:
  provider: github
  owner: capturingthe3rd
  repo: Desktop_Ash
  releaseType: release

afterSign: build/notarize.js

files:
  - dist/**/*
  - package.json
  - "!node_modules/**/*"
  - "!src/**/*"
